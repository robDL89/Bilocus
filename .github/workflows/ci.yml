# Builds the Revit add-in for every Revit version and runs every test suite:
# xUnit (net8.0 and net48), pytest, and the smoke test inside real Blender.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          # 8 for Revit 2025-2026 and the tests, 10 for Revit 2027
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build the add-in for Revit 2024 (net48)
        run: dotnet build src/Bilocus.Revit/Bilocus.Revit.csproj -c Release -p:RevitVersion=2024
      - name: Build the add-in for Revit 2025 (net8.0-windows)
        run: dotnet build src/Bilocus.Revit/Bilocus.Revit.csproj -c Release -p:RevitVersion=2025
      - name: Build the add-in for Revit 2026 (net8.0-windows)
        run: dotnet build src/Bilocus.Revit/Bilocus.Revit.csproj -c Release -p:RevitVersion=2026
      - name: Build the add-in for Revit 2027 (net10.0-windows)
        run: dotnet build src/Bilocus.Revit/Bilocus.Revit.csproj -c Release -p:RevitVersion=2027
      - name: Tests (net8.0 and net48)
        run: dotnet test Bilocus.sln -c Release

  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the Python bundled with Blender 4.2-4.5 and with Blender 5.x
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q
        working-directory: tests/python

  blender:
    name: Smoke test in Blender ${{ matrix.blender }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blender: ["4.2.23", "4.5.14", "5.1.2", "5.2.2"]
    steps:
      - uses: actions/checkout@v5
      - name: Download Blender
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -fsSL --retry 3 -o blender.tar.xz \
            "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
      - name: Run tests/blender/smoke_bake.py
        run: |
          ./blender/blender --background --factory-startup --python-exit-code 1 \
            --python tests/blender/smoke_bake.py
      - name: Run tests/blender/smoke_pull.py
        run: |
          ./blender/blender --background --factory-startup --python-exit-code 1 \
            --python tests/blender/smoke_pull.py
